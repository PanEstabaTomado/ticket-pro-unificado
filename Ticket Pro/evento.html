<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Pro - Inicio</title>
    <!--Vinculación con css -->
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    
    <header>
        <!-- Menú principal superior -->
         <nav class="navbar">
            <div class="logo">Ticket Pro</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="eventos.html">Eventos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
            <div class="carrito">
                <i class="fas fa-shopping-cart" id="icono-carrito"></i> Carrito (<span id="cart-count">0</span>)
            </div>
         </nav>

         <!--Sub-menú de auntenticacion-->
         <div class="auth-links">
            <a href="login.html">Iniciar sesión</a> |
            <a href="registro.html">Registrar usuario</a>
         </div>
    </header>

    <main>
        <!--Titulo o Logo del evento  -->
         <section class="hero">
            <div class="hero-content">
                <h1>Evento</h1>
            </div>
            <div class="imagen-portada placeholder">
                <span id="imagen-evento"></span>
            </div>
         </section>

         <!--Datos del Evento-->
         <section class="seccion-evento">
            <div id="evento-datos">
                <p class="titulo" id="titulo"></p>
                <p class="tipo" id="tipo"></p>
                <p class="fecha" id="fecha"></p>
                <p class="hora" id="hora"></p>
                <p class="lugar" id="lugar"></p>
                <p class="direccion" id="direccion"></p>
                <p class="precio" id="precio"></p>
                <p class="categoría" id="categoría"></p>
                <p class="duracion" id="duracion"></p>
                <p class="edadMinima" id="edadMinima"></p>
                <p class="estado" id="estado"></p>
                <p class="organizador" id="organizador"></p>
                <p class="descripcion" id="descripcion"></p>
            </div>
         </section>
         <!--Seccione del Evento donde eligiremos la cantidad de entradas y seccion a comprar-->
         <section class="secciones-evento">
            <div class="opciones-compra">
                <label for="secciones">Selecciona tu ubicación:</label>
                <ul id="secciones" class="lista-secciones">
                 
                </ul>
            <div class="selector-cantidad">
                <button id="btn-restar">-</button>
                <span id="numero">0</span>
                <button id="btn-sumar">+</button>
            </div>
            <div>
            <p>Total: <strong id="total-precio">$ 0</strong></p>    
            <button id="btn-comprar" class="btn-primario">Añadir al Carrito</button>
            </div>
         </section>
    
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-logo">Ticket Pro</div>
            <div class="footer-categorias">
                <span>Categoría Conciertos</span> |
                <span>Categoría Teatro</span> |
                <span>Categoría Deportes</span>
            </div>
            <div class="contacto">
                <p>Mantente en contacto | Únete a nuestro equipo</p>
                <form action="#" class="contacto-form">
                    <input type="email" placeholder="Ingresa Email" required>
                    <button type="submit">Subscribe</button>
                </form>
            </div>
        </div>
    </footer>

<script src="JS/1-redireccion.js"></script>
<script src="JS/2-datos.js"></script>
<script src="JS/3-cargar-datos.js"></script>
<script src="JS/4-funciones.js"></script>
</body>
</html>
